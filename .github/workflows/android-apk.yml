name: Android APK Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository (including Git LFS assets)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Git LFS tokenizer assets
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            app/src/main/assets/models/bpe_model.bin \
            app/src/main/assets/models/tokens_vocab.bin; do
            if [ ! -s "$file" ]; then
              echo "Required tokenizer asset is missing: $file" >&2
              exit 1
            fi
            if head -n 1 "$file" | grep -q '^version https://git-lfs.github.com/spec/v1$'; then
              echo "Git LFS pointer was checked out instead of the real asset: $file" >&2
              exit 1
            fi
          done

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemma-android-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
